<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0d"><title>KADZI STORE</title></head>
<body style="margin:0;background:#090a0d;color:#f5f6fa;font:15px system-ui;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box">

<script>
(async()=>{const msg=document.getElementById("msg");try{
const r=await fetch("https://vpuaihznkswrpsqxgcvm.supabase.co/functions/v1/kds-api",{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);

if(!page.includes('const API="https://vpuaihznkswrpsqxgcvm.supabase.co/functions/v1/kds-api?api=1";'))throw Error("API URL replacement failed");

}catch(e){msg.textContent="Не удалось загрузить магазин. Обнови страницу или попробуй позже.";console.error(e)}})();
</script></body></html>
